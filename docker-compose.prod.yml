# Standalone production layout; TLS terminates at the frontend Nginx edge.
# docker compose --env-file .env.production -f docker-compose.prod.yml ...
name: ${COMPOSE_PROJECT_NAME:-ilbi-platform}
x-logging: &bounded_logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'
services:
  postgres:
    security_opt: [no-new-privileges:true]
    image: postgres:16-alpine
    logging: *bounded_logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${POSTGRES_DB:?Set POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER:?Set POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      retries: 10
  redis:
    security_opt: [no-new-privileges:true]
    image: redis:7-alpine
    logging: *bounded_logging
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  ilbi:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    image: '${ILBI_BACKEND_IMAGE:-ilbi-backend:local}'
    build:
      context: ./backend
      target: production
    logging: *bounded_logging
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment: &backend_environment
      DJANGO_SETTINGS_MODULE: config.settings_production
      DJANGO_DEBUG: 'False'
      LOCAL_DEMO_LOGIN_ENABLED: 'False'
      GUNICORN_RELOAD: 'False'
      ALLOWED_HOSTS: '${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production},ilbi'
      FRONTEND_URL: 'https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production}'
      SECURE_HSTS_SECONDS: '${SECURE_HSTS_SECONDS:-3600}'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      DB_HOST: postgres
      DB_PORT: '5432'
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./docs:/app/docs
    healthcheck:
      test: [CMD, python, -B, healthcheck.py]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 3
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  celery_worker:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    image: '${ILBI_BACKEND_IMAGE:-ilbi-backend:local}'
    build:
      context: ./backend
      target: production
    logging: *bounded_logging
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=100
    volumes:
      - media_data:/app/media
    env_file: ./backend/.env.production
    environment: *backend_environment
    depends_on:
      ilbi: {condition: service_healthy}
  celery_beat:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    image: '${ILBI_BACKEND_IMAGE:-ilbi-backend:local}'
    build:
      context: ./backend
      target: production
    logging: *bounded_logging
    restart: unless-stopped
    command: celery -A config beat -l info --schedule=/app/state/celerybeat-schedule
    volumes:
      - celery_beat_data:/app/state
    env_file: ./backend/.env.production
    environment: *backend_environment
    depends_on:
      ilbi: {condition: service_healthy}
  bot:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    image: '${ILBI_BOT_IMAGE:-ilbi-bot:local}'
    build:
      context: ./telegram_bot_sms
      target: production
    logging: *bounded_logging
    restart: unless-stopped
    env_file: ./telegram_bot_sms/.env.production
    depends_on:
      ilbi: {condition: service_healthy}
  frontend:
    security_opt: [no-new-privileges:true]
    image: '${ILBI_FRONTEND_IMAGE:-ilbi-frontend:local}'
    logging: *bounded_logging
    build:
      context: ./frontend/ilbi
      target: production
    restart: unless-stopped
    environment:
      PUBLIC_HOST: '${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production}'
      SECURE_HSTS_SECONDS: '${SECURE_HSTS_SECONDS:-3600}'
      NGINX_ENVSUBST_FILTER: '^(PUBLIC_HOST|SECURE_HSTS_SECONDS)$'
    ports:
      - '${EDGE_BIND_ADDRESS:-0.0.0.0}:80:80'
      - '${EDGE_BIND_ADDRESS:-0.0.0.0}:443:443'
    volumes:
      - static_data:/var/www/static:ro
      - ./desktop/downloads:/var/www/downloads:ro
      - type: bind
        source: '${TLS_CERT_DIR:?Set TLS_CERT_DIR to the directory containing fullchain.pem and privkey.pem}'
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      ilbi: {condition: service_healthy}
  minio:
    image: cgr.dev/chainguard/minio:latest
    logging: *bounded_logging
    profiles: [minio]
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes: [minio_data:/data]
volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  celery_beat_data:
  minio_data:
