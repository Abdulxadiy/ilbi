name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      publish_backend:
        description: Publish only the reviewed mobile backend image after all checks
        type: boolean
        required: false
        default: false
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/automation -v
  desktop:
    needs: [automation, dependency-security, bot, production-edge, backend, frontend]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop-windows.yml
  desktop-linux:
    needs: [automation, dependency-security, bot, production-edge, backend, frontend]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop-linux.yml
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.12.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Audit locked production dependencies
        run: |
          uv export --project ilbi --frozen --no-dev --group desktop --no-hashes --no-emit-project --format requirements-txt --output-file /tmp/backend-requirements.txt
          uv export --project telegram_bot_sms --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt --output-file /tmp/bot-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r /tmp/backend-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r /tmp/bot-requirements.txt
          npm audit --prefix frontend/ilbi --omit=dev --audit-level=high
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.12.x" }
      - run: uv sync --project telegram_bot_sms --frozen
      - run: uv run --project telegram_bot_sms python -m unittest discover -s telegram_bot_sms/tests -v
  production-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment scripts
        run: |
          python3 desktop/release_version.py
          for script in ops/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests/deployment -p 'test_operations.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_ci_handoff.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_download_activation.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_linux_downloads.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_release*.py' -v
      - name: Fetch isolated test images
        run: |
          docker pull nginx:alpine
          docker pull python:3.12-slim
      - name: Test HTTPS boundary and activation failure recovery
        run: python3 -m unittest discover -s tests/deployment -p 'test_https*.py' -v
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: ilbi_test, POSTGRES_USER: ilbi_test, POSTGRES_PASSWORD: ilbi_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ilbi_test" --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    defaults: { run: { working-directory: ilbi } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.12.x" }
      - run: uv sync --frozen
      - run: uv run ruff check . --select E9,F821,F822,F823
      - run: uv run python manage.py spectacular --settings=config.settings_test --validate --fail-on-warn --file /tmp/schema.yaml
      - name: Tests
        run: uv run pytest -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
          TEST_DB_NAME: ilbi_test
          TEST_DB_USER: ilbi_test
          TEST_DB_PASSWORD: ilbi_test
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5433"
          TEST_REDIS_URL: redis://localhost:6380/0
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/ilbi } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/ilbi/package-lock.json }
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - name: Check optional offline setup and remembered login
        run: |
          npm run test:sync
          npm run test:auth-session
      - name: Check download links and mobile layout in Chrome
        run: npm run test:downloads
      - name: Check desktop update notices
        run: node tests/updates.browser.mjs
      - run: npm run build
      - name: Check the bundled desktop guide without a cloud server
        run: npm run test:desktop-guide
  mobile-backend-image:
    needs: [automation, dependency-security, bot, production-edge, backend, frontend]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_backend == true &&
      github.repository == 'Abdulxadiy/ilbi' &&
      github.ref == 'refs/heads/mobile/backend-api-readiness-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the reviewed backend tree before publication
        env:
          EXPECTED_BACKEND_TREE: 8e345678586c4cbeb870ee7f0a866e1c0687e325
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD:ilbi)" = "$EXPECTED_BACKEND_TREE"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('ops/mobile-backend-candidate.json').read_text())
          assert manifest['backend_source'] == 'd35ea11043affab1671172f42e27d367033232a1'
          assert manifest['production_base'] == '2d799dd5596a92fb6a0e3be6cf51a2a018c88e2d'
          for group in ('files', 'shared_contract_fixtures', 'additional_operations_files'):
              for entry in manifest[group]:
                  path = Path(entry['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not path.is_symlink()
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['sha256'], str(path)
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit-pinned backend image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}/backend:sha-$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./ilbi
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mobile-backend
          cache-to: type=gha,mode=max,scope=mobile-backend
      - name: Export the published backend for authenticated artifact transfer
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE_TAG%:*}@$IMAGE_DIGEST"
          docker tag "${IMAGE_TAG%:*}@$IMAGE_DIGEST" "$IMAGE_TAG"
          docker save "$IMAGE_TAG" | gzip -1 > mobile-backend-image.tar.gz
      - name: Record published image identity without deploying
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          digest = os.environ['IMAGE_DIGEST']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest)
          image = os.environ['IMAGE_TAG']
          inspected = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image]))[0]
          assert inspected['Config']['Labels']['org.opencontainers.image.revision'] == os.environ['GITHUB_SHA']
          assert (inspected['Os'], inspected['Architecture']) == ('linux', 'amd64')
          archive = Path('mobile-backend-image.tar.gz')
          checksum = hashlib.sha256()
          with archive.open('rb') as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b''):
                  checksum.update(chunk)
          record = {
              'candidate_commit': os.environ['GITHUB_SHA'],
              'backend_source': 'd35ea11043affab1671172f42e27d367033232a1',
              'image': image,
              'digest': digest,
              'digest_reference': image.split(':', 1)[0] + '@' + digest,
              'docker_image_id': inspected['Id'],
              'archive': archive.name,
              'archive_sha256': checksum.hexdigest(),
              'archive_bytes': archive.stat().st_size,
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'deployed': False,
          }
          Path('mobile-backend-image.json').write_text(json.dumps(record, indent=2) + '\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f"Published backend only: `{image}`\n\nDigest: `{digest}`\n\nNo deployment performed.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-backend-image
          path: |
            mobile-backend-image.json
            mobile-backend-image.tar.gz
          retention-days: 3
          if-no-files-found: error
