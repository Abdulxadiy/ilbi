name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/automation -v
  desktop:
    needs: [automation, dependency-security, bot, production-edge, backend, frontend]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop-windows.yml
  desktop-linux:
    needs: [automation, dependency-security, bot, production-edge, backend, frontend]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop-linux.yml
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.12.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Audit locked production dependencies
        run: |
          uv export --project backend --frozen --no-dev --group desktop --no-hashes --no-emit-project --format requirements-txt --output-file /tmp/backend-requirements.txt
          uv export --project telegram_bot_sms --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt --output-file /tmp/bot-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r /tmp/backend-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r /tmp/bot-requirements.txt
          npm audit --prefix frontend/ilbi --omit=dev --audit-level=high
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.12.x" }
      - run: uv sync --project telegram_bot_sms --frozen
      - run: uv run --project telegram_bot_sms python -m unittest discover -s telegram_bot_sms/tests -v
  production-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment scripts
        run: |
          python3 desktop/release_version.py
          for script in ops/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests/deployment -p 'test_operations.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_ci_handoff.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_download_activation.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_mobile_downloads.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_mobile_build_setup.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_mobile_apk_verification.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_mobile_bundle_sources.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_linux_downloads.py' -v
          python3 -m unittest discover -s tests/deployment -p 'test_release*.py' -v
      - name: Fetch isolated test images
        run: |
          docker pull nginx:alpine
          docker pull python:3.12-slim
      - name: Test HTTPS boundary and activation failure recovery
        run: python3 -m unittest discover -s tests/deployment -p 'test_https*.py' -v
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: ilbi_test, POSTGRES_USER: ilbi_test, POSTGRES_PASSWORD: ilbi_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ilbi_test" --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.12.x" }
      - run: uv sync --frozen
      - run: uv run ruff check . --select E9,F821,F822,F823
      - run: uv run python manage.py spectacular --settings=config.settings_test --validate --fail-on-warn --file /tmp/schema.yaml
      - name: Tests
        run: uv run pytest -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
          TEST_DB_NAME: ilbi_test
          TEST_DB_USER: ilbi_test
          TEST_DB_PASSWORD: ilbi_test
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5433"
          TEST_REDIS_URL: redis://localhost:6380/0
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/ilbi } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/ilbi/package-lock.json }
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - name: Check optional offline setup and remembered login
        run: |
          npm run test:sync
          npm run test:auth-session
          npm run test:validation
      - name: Check download links and mobile layout in Chrome
        run: npm run test:downloads
      - name: Check desktop update notices
        run: node tests/updates.browser.mjs
      - run: npm run build
      - name: Check the bundled desktop guide without a cloud server
        run: npm run test:desktop-guide
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile-app/package-lock.json }
      - run: npm ci
      - name: Lint every mobile source and test
        run: npx eslint . --max-warnings 0
      - run: npm run typecheck
      - name: Unit, component and real serializer contract regressions
        run: npm test -- --json --outputFile=/tmp/ilbi-mobile-jest.json
      - name: Android and iOS JavaScript exports
        run: npx expo export --platform android --platform ios --max-workers 2 --output-dir /tmp/ilbi-mobile-exports
      - name: Start isolated synthetic phone preview
        working-directory: .
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp telegram_bot_sms/.env.example telegram_bot_sms/.env
          docker compose --profile mobile up --build --no-deps -d mobile
      - name: Phone interaction and Fast Refresh regression
        run: npm run test:preview
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-checks
          path: |
            /tmp/ilbi-mobile-jest.json
            mobile-app/docs/evidence/*.png
          if-no-files-found: warn
      - name: Stop preview
        if: always()
        working-directory: .
        run: docker compose --profile mobile stop mobile
  mobile-dependency-security:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile-app/package-lock.json }
      - run: npm ci
      - name: Report unresolved dependency vulnerabilities without suppressing failures
        run: npm audit --audit-level=high
