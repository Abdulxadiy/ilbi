name: Deploy production
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
concurrency:
  group: ilbi-production
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
  packages: write
jobs:
  target:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.target.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Skip superseded CI before building release images
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash ops/check_deploy_target.sh
  deploy:
    needs: target
    if: needs.target.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Download the Windows package verified by this CI run
        uses: actions/download-artifact@v4
        with:
          name: ILBI-Windows-x64
          path: desktop-release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify public installer before transfer
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 desktop/verify_downloads.py desktop-release "$RELEASE_SHA"
      - name: Download the Linux package verified by this CI run
        uses: actions/download-artifact@v4
        with:
          name: ILBI-Linux-x64
          path: desktop-release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify Linux archive and combine tested download feeds
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 desktop/verify_linux_downloads.py desktop-release "$RELEASE_SHA"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.prefix }}/backend:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend/ilbi
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.prefix }}/frontend:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: docker/build-push-action@v6
        with:
          context: ./telegram_bot_sms
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.prefix }}/bot:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
      - name: Check the tested commit is still main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash ops/check_deploy_target.sh
      - name: Configure SSH
        if: steps.target.outputs.current == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host production\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  BatchMode yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: Transfer reviewed operations files
        if: steps.target.outputs.current == 'true'
        run: |
          rsync -a ops/ production:/srv/ilbi/ops/
          rsync -a scripts/data_backup.py production:/srv/ilbi/scripts/
          ssh production 'python3 /srv/ilbi/ops/prepare_backend_layout.py /srv/ilbi --apply'
          rsync -a docker-compose.prod.yml production:/srv/ilbi/
          ssh production 'mkdir -p /srv/ilbi/desktop/downloads'
          # Immutable commit directories keep existing download links intact.
          rsync -a --delay-updates --exclude=releases.json desktop-release/downloads/ production:/srv/ilbi/desktop/downloads/
          rsync -a desktop-release/downloads/releases.json production:/srv/ilbi/desktop/.release-pending.json
      - name: Deploy commit images
        if: steps.target.outputs.current == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          PREFIX: ${{ steps.image.outputs.prefix }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          # The registry credential is stdin-only and removed after this SSH session.
          printf '%s' "$REGISTRY_TOKEN" | ssh production \
            "set -eu; export DOCKER_CONFIG=\$(mktemp -d); trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT; docker login ghcr.io -u '$REGISTRY_USER' --password-stdin; cd /srv/ilbi; ./ops/deploy_release.sh '$PREFIX/backend:$TAG' '$PREFIX/frontend:$TAG' '$PREFIX/bot:$TAG'"
      - name: Activate downloads after application health checks
        if: steps.target.outputs.current == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: ssh production "python3 /srv/ilbi/ops/activate_downloads.py /srv/ilbi/desktop/downloads /srv/ilbi/desktop/.release-pending.json '$RELEASE_SHA'"
      - name: Publish a new desktop version with the tested Windows and Linux packages
        if: steps.target.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 desktop/publish_release.py desktop-release "$RELEASE_SHA"
      - name: Remove superseded Windows artifacts
        if: steps.target.outputs.current == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            --jq ".artifacts[] | select((.name == \"ILBI-Windows-x64\" or .name == \"ILBI-Linux-x64\") and .workflow_run.head_branch == \"main\" and .workflow_run.id < $RELEASE_RUN_ID) | .id" > /tmp/old-windows-artifacts
          while read -r artifact; do
            [[ "$artifact" =~ ^[0-9]+$ ]] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
          done < /tmp/old-windows-artifacts
