[project]
name = "ilbi"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.105",
    "celery>=5.6.3",
    "cryptography>=46.0.0",
    "defusedxml>=0.7.1",
    "django>=6.0.7",
    "django-filter>=26.1",
    "django-storages>=1.14.6",
    "djangorestframework>=3.18.2",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gevent>=26.8.0",
    "gunicorn>=26.1.0",
    "openpyxl>=3.1.5",
    "packaging>=26.3",
    "pillow>=13.0.0",
    "psycopg2>=2.9.12",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
desktop = ["waitress==3.0.2"]
dev = [
    "djangorestframework-stubs>=3.17.1",
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106"]
"tests/*" = ["S101", "S105", "S106"]
"config/settings_test.py" = ["S101", "S105", "S106"]
